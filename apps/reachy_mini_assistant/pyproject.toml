[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_assistant"
version = "0.1.0"
description = "Asistente hablante conversacional para Reachy Mini (VAD + STT + LLM + TTS enchufable)."
requires-python = ">=3.11"
dependencies = [
    "reachy-mini>=1.13.0",
    "openai==2.28.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
tts-piper = ["piper-tts>=1.2"]
vad = ["silero-vad>=5.0", "onnxruntime>=1.17"]

[project.scripts]
reachy-mini-assistant = "reachy_mini_assistant.main:main"

[project.entry-points."reachy_mini_apps"]
reachy_mini_assistant = "reachy_mini_assistant.main:ReachyMiniAssistantApp"

[tool.setuptools.packages.find]
where = ["src"]
